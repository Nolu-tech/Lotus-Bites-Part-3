<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Lotus Bites</title>

    <meta name="description" content="Contact Lotus Bites for enquiries, questions and assistance with your food orders.">

    <meta name="keywords" content="Lotus Bites, contact, food enquiries, sushi, noodles">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <nav>

        <div class="logo">

            <a href="index.html">Lotus Bites</a>

        </div>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="products.html">Menu</a></li>

            <li><a href="enquiry.html">Order</a></li>

            <li><a href="contact.html" class="active">Contact</a></li>

        </ul>

    </nav>

</header>

<main>

    <section class="page-heading">

        <h1>Contact Us</h1>

        <p>We would love to hear from you. Send us your questions or feedback.</p>

    </section>

    <section class="contact-section">

        <h2>Get in Touch</h2>

        <form id="contactForm">

            <div class="form-group">

                <label for="contactName">Full Name</label>

                <input

                    type="text"

                    id="contactName"

                    name="name"

                    placeholder="Enter your full name"

                    required

                >

            </div>

            <div class="form-group">

                <label for="contactEmail">Email Address</label>

                <input

                    type="email"

                    id="contactEmail"

                    name="email"

                    placeholder="Enter your email address"

                    required

                >

            </div>

            <div class="form-group">

                <label for="contactSubject">Subject</label>

                <input

                    type="text"

                    id="contactSubject"

                    name="subject"

                    placeholder="Enter the subject"

                    required

                >

            </div>

            <div class="form-group">

                <label for="contactMessage">Your Message</label>

                <textarea

                    id="contactMessage"

                    name="message"

                    rows="5"

                    placeholder="Type your message here"

                    required

                ></textarea>

            </div>

            <button type="submit" class="btn">

                Send Message

            </button>

            <p id="contactFeedback" role="status" aria-live="polite"></p>

        </form>

    </section>

</main>

<footer>

    <p>&copy; 2026 Lotus Bites. All rights reserved.</p>

</footer>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const contactForm = document.getElementById("contactForm");

    const feedback = document.getElementById("contactFeedback");

    const recipientEmail = "info@lotusbites.co.za";

    contactForm.addEventListener("submit", function (event) {

        event.preventDefault();

        if (!contactForm.checkValidity()) {

            contactForm.reportValidity();

            return;

        }

        const name = document.getElementById("contactName").value.trim();

        const email = document.getElementById("contactEmail").value.trim();

        const subject = document.getElementById("contactSubject").value.trim();

        const message = document.getElementById("contactMessage").value.trim();

        const emailSubject = encodeURIComponent(subject);

        const emailBody = encodeURIComponent(

            "Name: " + name + "\n" +

            "Email: " + email + "\n\n" +

            "Message:\n" + message

        );

        const mailtoLink =

            "mailto:" + recipientEmail +

            "?subject=" + emailSubject +

            "&body=" + emailBody;

        feedback.textContent =

            "Opening your email application. Please review and send your message.";

        window.location.href = mailtoLink;

    });

});

</script>

</body>

</html>
